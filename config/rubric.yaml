version: "1.0"
name: "Rúbrica de Evaluación de Video Ads (Jinora)"
scoring:
  scale: "0-25 por dimensión (total 0-100 calculado por código)"
  neutrality: "Neutralidad frente a la IA: la mención de IA es descriptiva y no suma ni resta puntos"
  caps: "Sin cupos ni topes numéricos. Todo el rango 0-25 es accesible según cumplimiento estricto del ancla"

dimensions:
  hook:
    name: "Captación (0-3 s)"
    max_score: 25
    anchors:
      "0-6": "Arranca con logo o intro corporativa genérica; sin texto ni voz que enganche."
      "7-12": "Gancho presente pero predecible o cliché (ej. '¿Quieres aumentar tus ventas?')."
      "13-19": "Gancho específico con dolor o curiosidad claros; el visual y texto acompañan activamente."
      "20-25": "Interrupción de patrón contundente + dolor visceral o afirmación contraintuitiva; audio y visual sincronizados con alto impacto."

  mechanism:
    name: "Mecanismo único y prueba"
    max_score: 25
    anchors:
      "0-6": "Solo afirmaciones vacías o superlativos sin evidencia (ej. 'la mejor plataforma')."
      "7-12": "Explica conceptualmente qué hace pero sin mostrar el producto ni interfaces reales."
      "13-19": "Muestra el producto en acción (capturas de pantalla, demo parcial o métrica verificable)."
      "20-25": "Demostración en vivo comprobable, caso de éxito con números o contraste directo entre proceso manual vs automatizado."

  narrative:
    name: "Narrativa y ritmo (Pacing)"
    max_score: 25
    anchors:
      "0-6": "Monótono, plano, sin estructura argumental; se cae el interés a los pocos segundos."
      "7-12": "Estructura básica pero con ritmo irregular o baches de atención."
      "13-19": "Estructura clara de problema a solución con ritmo sostenido y dinámico."
      "20-25": "Arco de tensión completo (tensión, quiebre, alivio), edición ágil y locución que retiene la atención hasta el CTA final."

  offer:
    name: "Oferta y CTA"
    max_score: 25
    anchors:
      "0-6": "Sin llamada a la acción o CTA confuso/inaudible."
      "7-12": "CTA genérico y pasivo (ej. 'Más información')."
      "13-19": "CTA directo con beneficio explícito de la acción."
      "20-25": "Llamada a la acción de mínima fricción con reversión de riesgo clara (prueba gratis, demo inmediata, garantía) y urgencia justificada."
