# Jinora: web dashboard/API + job worker.
#
# Before the first `docker compose up`:
#   1. cp .env.example .env   and fill in your keys (the file stays on your machine; it is never copied into the image).
#   2. Linux hosts: export JINORA_UID=$(id -u) JINORA_GID=$(id -g) so the container can write to ./data, ./downloads, ./logs.
#
# The dashboard is published ONLY on 127.0.0.1:8000 of the host. Both services share the same SQLite file in ./data.

x-jinora: &jinora
  build: .
  image: jinora:local
  env_file: .env
  user: "${JINORA_UID:-10001}:${JINORA_GID:-10001}"
  restart: unless-stopped
  environment:
    DATABASE_URL: sqlite:///data/meta_ads.db
  volumes:
    - ./data:/app/data
    - ./downloads:/app/downloads
    - ./logs:/app/logs
    - ./config:/app/config
    - ./reports:/app/reports

services:
  web:
    <<: *jinora
    container_name: jinora_web
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *jinora
    container_name: jinora_worker
    command: ["python", "-m", "src.cli", "worker"]
    depends_on:
      - web
    healthcheck:
      disable: true  # the image HEALTHCHECK probes the web port; the worker does not serve HTTP

# PostgreSQL instead of SQLite (optional): add a database service, set DATABASE_URL for web and worker, and keep the
