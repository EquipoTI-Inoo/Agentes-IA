version: "3.8"

services:
  app:
    build: .
    container_name: jinora_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///data/meta_ads.db
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./reports:/app/reports
      - ./config:/app/config

